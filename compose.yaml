# Local PostgreSQL for development. Production uses Neon.
# Port 5433 avoids clashing with other local Postgres instances on 5432.
services:
  db:
    image: postgres:17-alpine
    container_name: n5deal_postgres
    environment:
      POSTGRES_USER: n5deal
      POSTGRES_PASSWORD: n5deal
      POSTGRES_DB: n5deal
    ports:
      - "5433:5432"
    volumes:
      - n5deal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n5deal -d n5deal"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  n5deal_pgdata:
